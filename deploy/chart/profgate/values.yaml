# Default values for the profgate chart.
# Every key here is documented where it is defined; the chart's README.md
# explains how the configuration file is assembled from these values.

image:
  repository: ghcr.io/arloliu/profgate
  # Empty means Chart.yaml's appVersion.
  tag: ""
  # A digest, "sha256:...", replaces the tag when it is set.
  # This is the reproducible way to pin a build.
  digest: ""
  pullPolicy: IfNotPresent

# Names of Secrets holding registry credentials, as [{name: my-pull-secret}].
imagePullSecrets: []

# Override the generated resource names.
nameOverride: ""
fullnameOverride: ""

# Two replicas primarily buy availability through a rollout or a replica
# failure. More replicas also add aggregate capacity: the interactive
# admission gate (limits.maxConcurrentProfiles) and the PGO limits are per
# replica.
replicaCount: 2

serviceAccount:
  create: true
  # Empty means the generated fullname. Set it to bind an existing account.
  name: ""
  annotations: {}

rbac:
  # The ClusterRole and ClusterRoleBinding, named after the release so two
  # releases in one cluster do not collide. The rules are read-only and fixed:
  # services (list, watch), pods (get, list, watch), endpointslices
  # (list, watch). The chart offers no way to widen them.
  create: true

service:
  type: ClusterIP
  # The API port. The ops port (metrics, health) is not in the Service;
  # scrape it from the Pod.
  port: 8080
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Set maxUnavailable instead of minAvailable to express the same budget the
  # other way around. Set exactly one and clear the other ("" and null both
  # mean unset); zero is a real bound (maxUnavailable: 0 forbids voluntary
  # disruption). Setting both fails rendering, as does enabling the budget
  # with neither set.
  maxUnavailable: ""

# Add checksum/config to the pod template, holding a hash of the rendered
# ConfigMap. The binary reads its configuration once at startup and has no
# reload, so without this annotation a helm upgrade that only changes
# configuration updates the ConfigMap and never restarts a Pod.
# Turning this off means config changes take effect at the next unrelated
# rollout, whenever that is.
configChecksumAnnotation: true

# Pod-level security context.
# fsGroup is what makes the NATS credentials, the TLS key, and the
# authentication files readable by the non-root image: each is mounted at
# 0440, and the kubelet only changes a volume's group ownership when fsGroup
# is set.
# 65532 is the uid and gid the distroless image runs as.
# Set fsGroup to null to render no pod securityContext at all, which is what a
# cluster that assigns its own ranges through an SCC needs; that cluster has to
# make the mounted Secrets readable by the uid it assigns some other way.
podSecurityContext:
  fsGroup: 65532

# Container-level security context. This is the hardened block the security
# invariant requires; runAsUser is deliberately absent so a cluster that
# assigns its own uid can, while runAsNonRoot still rejects a root image.
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Container resources. An explicit block here is rendered verbatim and turns
# off the derived memory limit below; use it when a cluster's quota or
# LimitRange demands requests, or a CPU limit.
resources: {}

# The memory limit while pgo.enabled is false.
# With PGO off the gateway streams profiles through to the client and holds no
# profile in memory, so its footprint is the runtime plus the informer caches
# plus limits.maxConcurrentProfiles transfer buffers.
# With PGO on this value is ignored and the limit is derived from pgo.limits;
# see the README.
memoryLimitWithoutPGO: 512Mi

# How long the kubelet waits after SIGTERM before SIGKILL.
# It covers server.drainDelay and then the drain of in-flight profile
# requests, whose longest is limits.cpuSeconds or limits.traceSeconds plus 60
# seconds of slack: 125 seconds at the shipped values.
# With PGO on, a Collection can run far longer than this, and
# `profgate config validate` prints the period that lets a drain wait through
# any admissible Collection's deadline; work still running at its deadline is
# abandoned, so that figure bounds the wait rather than guaranteeing
# completion. Raising this to that number is a tradeoff, not a requirement:
# a Collection the kubelet kills mid-merge loses that attempt's samples —
# another replica reclaims it and retries from round zero only if the lease
# expires before the Collection's deadline and an attempt remains under
# pgo.maxAttempts; otherwise the Collection fails as deadline_exceeded or
# attempts_exhausted, whichever bound wins.
terminationGracePeriodSeconds: 125

# There is no livenessProbe, by design. /healthz answers 200 as soon as the
# HTTP server is up and does not depend on Kubernetes or NATS, so a liveness
# probe on it could detect nothing but an HTTP server that has stopped
# answering at all, and restarting over a dependency outage would be worse.
# The accepted cost is that nothing restarts a hung process. Readiness is
# the mechanism that keeps traffic off a gateway that cannot serve.
readinessProbe:
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3

# Extra environment variables on the container, as a list of core/v1 EnvVar.
# The binary applies PROFGATE_-prefixed overrides on top of the configuration
# file, so this is the way to change one key without putting it in the raw
# config block or the rendered ConfigMap:
#   extraEnv:
#     - name: PROFGATE_LOG_LEVEL
#       value: debug
# An override set here lands in the Pod template, so changing it rolls the
# Deployment on upgrade.
# The overrides for the keys the memory limit is derived from are rejected at
# render time: PROFGATE_PGO_ENABLED, PROFGATE_PGO_LIMIT_MAX_PARALLEL,
# PROFGATE_PGO_LIMIT_MAX_SAMPLE_BYTES, PROFGATE_PGO_LIMIT_MAX_MERGED_BYTES,
# and PROFGATE_PGO_LIMIT_MAX_ACTIVE_COLLECTIONS. A value arriving here would
# change PGO's memory use without moving the rendered limits.memory;
# set the pgo values below instead.
# The file-path keys the Secret mounts follow are rejected too:
# PROFGATE_NATS_CREDS_FILE, PROFGATE_TLS_CERT_FILE, and
# PROFGATE_TLS_KEY_FILE. A path arriving here can name a file nothing
# mounts; set the nats and tls values below instead.
extraEnv: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# An ingress NetworkPolicy for the gateway Pods. It is off by default because
# the namespaces that reach the two ports differ per cluster;
# deploy/base/networkpolicy-gateway.yaml is the same policy as plain YAML,
# and deploy/networkpolicy-app-example.yaml is the matching policy an
# application namespace needs to admit the gateway to its pprof port.
networkPolicy:
  enabled: false
  # Namespaces allowed to reach the API port, matched on
  # kubernetes.io/metadata.name.
  apiFromNamespaces:
    - ingress-nginx
  # Namespaces allowed to reach the ops port.
  opsFromNamespaces:
    - monitoring
  # networkPolicy above renders policyTypes: [Ingress] only, so every
  # destination stays open; there is no key here that turns Egress on. Once
  # a policy elsewhere selects the gateway Pods for egress too, every
  # destination the gateway reaches needs its own rule or it stops working:
  # DNS, the Kubernetes API, the Pod pprof ports across every application
  # namespace, NATS when pgo.enabled, and the OpenID Connect issuer when
  # auth.mode is oidc. The issuer rule alone, once the destinations above are
  # also covered:
  #
  # egress:
  #   - to:
  #       - ipBlock:
  #           cidr: <the issuer's IP address or CIDR>/32
  #     ports:
  #       - protocol: TCP
  #         port: 443

# --- Configuration file ---------------------------------------------------
# The keys below are rendered into the ConfigMap the gateway loads from
# /etc/profgate/config.yaml. Anything the chart does not model structurally
# goes in the raw `config` block at the bottom, which is merged over
# everything here.

server:
  # One of debug, info, warn, error.
  logLevel: info
  # The window between /readyz turning 503 and the API listener closing, so
  # the EndpointSlice controllers and every kube-proxy stop routing new
  # requests to this replica before it stops accepting them. The image is
  # distroless and runs no preStop hook, so the gateway waits in process.
  # terminationGracePeriodSeconds below covers this window.
  drainDelay: 5s

auth:
  # disabled, basic, or oidc.
  mode: disabled
  # The realm every request gets while authentication is disabled.
  # It must name one of the realms below. Rejected when mode is not disabled.
  anonymousRealm: developer
  basic:
    # Inline users, rendered into auth.basic.users verbatim. Each carries a
    # bcrypt hash from `profgate auth hash`, never a plaintext password:
    #   users:
    #     - name: alice
    #       passwordHash: "$2a$12$..."
    #       realm: developer
    users: []
    # The Secret data key an operator's users file appears under, mounted at
    # auth.secret.mountPath. "" renders no auth.basic.usersFile key, which is
    # fine when every user is inline above. A non-empty value needs
    # auth.secret.enabled true; the users file is what a Secret volume, not a
    # ConfigMap, is for -- see the chart's README.
    usersFile: ""
    # true lets basic mode run without server.tls. A gateway reachable only
    # from inside the cluster, behind a mesh that already encrypts the hop,
    # is the case this covers; see the chart's README before turning it on.
    allowPlaintext: false
    maxConcurrent: 16
  oidc:
    issuer: ""
    audience: ""
    # id or access. Must stay id when browser below is set.
    tokenType: id
    usernameClaim: sub
    groupsClaim: groups
    # The Secret data key the issuer's CA certificate appears under, mounted
    # at auth.secret.mountPath. "" means the issuer's certificate chains to a
    # certificate authority the image already trusts.
    caKey: ""
    httpProxy: ""
    mapping:
      # Username and group entries turn a verified token into a realm; at
      # least one of users, groups, or defaultRealm is required in oidc mode.
      #   users:
      #     - name: alice
      #       realm: developer
      #   groups:
      #     - name: platform-team
      #       realm: developer
      users: []
      groups: []
      defaultRealm: ""
    # The optional relying-party block that turns a browser login into a
    # session cookie. Empty renders no auth.oidc.browser block at all, which
    # is what makes bearer-token-only oidc mode possible. Requires
    # tls.enabled, because the session cookie carries Secure and a __Host-
    # prefix, which a plaintext listener cannot set.
    #   browser:
    #     clientID: profgate
    #     redirectURL: https://profgate.example.com/auth/callback
    #     # The Secret data key a confidential client's secret appears
    #     # under. "" means a public client using PKCE, which is enough for
    #     # Keycloak, Dex, and Okta.
    #     clientSecretFile: ""
    browser: {}
  # The Secret the files named above -- the users file, the issuer CA, the
  # client secret, and the cookie key -- are read from. The chart never
  # creates it; see deploy/secret-auth-example.yaml.
  secret:
    enabled: false
    existingSecret: profgate-auth
    mountPath: /etc/profgate/auth

# What each principal may reach. Every list is exact strings or "*".
# The shipped realm is wide open, which is a deliberate default for a gateway
# reachable only from inside the cluster; narrow it before exposing it.
realms:
  developer:
    namespaces: ["*"]
    services: ["*"]
    profiles: ["*"]
    # PGO access is off for a realm that names no pgo block.
    # pgo:
    #   read: true
    #   collect: true
    #   configure: true

# HTTPS on the API port. Off means plaintext, with TLS terminating at an
# Ingress or a mesh, which is the shipped topology. The ops port stays
# plaintext either way: the kubelet's probe and the metrics scraper reach it by
# Pod address, where a certificate could never be verified anyway.
# The port and its name do not change with the scheme.
tls:
  enabled: false
  # The kubernetes.io/tls Secret the operator, or cert-manager, creates. The
  # chart never creates it, the same way it never creates the NATS one.
  # The volume is not optional, unlike the NATS one: enabling TLS asserts the
  # certificate exists, so a missing Secret holds the Pod at mount time with an
  # event naming it rather than starting a Pod that exits over a file.
  existingSecret: profgate-tls
  certKey: tls.crt
  keyKey: tls.key
  mountPath: /etc/profgate/tls
  # The floor handshakes are held to: 1.2 or 1.3.
  minVersion: "1.2"
  # There is no enabled flag in the configuration file the gateway reads:
  # server.tls is implied by naming the two files, the way nats.credsFile is.
  # This flag exists because Helm needs a boolean to render a conditional, just
  # as pgo.enabled gates the credentials volume.

# NATS, used only when pgo.enabled. The chart renders these keys into the
# configuration and mounts the credentials Secret; it never creates the
# Secret, the account, or the stores. deploy/nats/README.md is how they are
# provisioned.
nats:
  # Comma-separated nats:// or tls:// URLs. Required when pgo.enabled.
  # The URL must be here or in the raw config block's nats.url: an extraEnv
  # PROFGATE_NATS_URL cannot satisfy the requirement, because rendering
  # cannot see environment values.
  # A user:password in the URL is rendered verbatim into the ConfigMap and
  # printed in the install notes; to keep it out of both, set a
  # credential-free URL here and override it at runtime with an extraEnv
  # PROFGATE_NATS_URL valued from a Secret.
  url: ""
  # Where the credentials file appears in the container. It must equal the
  # mountPath below joined with secretKey, because that join is the only path
  # the mounted Secret puts a file at; rendering fails when the three values
  # disagree. "" mounts no Secret and renders no credsFile key, so the
  # gateway sends no JWT credentials; a user:password carried in the URL
  # still authenticates it.
  credsFile: /etc/profgate/nats/nats.creds
  # The Secret the operator created from their NATS account credentials.
  # Create it before turning pgo.enabled on: startup validation opens the
  # file credsFile names, so a gateway whose Secret does not exist yet exits
  # rather than running without it. The volume itself is optional, which only
  # lets a Pod start before the Secret exists -- startup keeps failing until
  # the file appears. A rotation is a different matter: the kubelet projects
  # an update to the Secret into the volume of a running Pod whether or not
  # the volume is optional.
  existingSecret: profgate-nats-creds
  # The Secret key and the mount path it appears under. credsFile above must
  # be their join.
  secretKey: nats.creds
  mountPath: /etc/profgate/nats

pgo:
  # PGO collection. Off means no NATS connection and no scheduler.
  # A Pod cannot become Ready while NATS is unreachable and this is on, so a
  # rollout stalls at maxUnavailable 0 rather than replacing a working replica
  # with one that cannot collect. That is the safe failure, but it does mean
  # NATS being down blocks upgrades.
  enabled: false
  # The Collection configuration API: enabled or disabled.
  configAPI: enabled
  # The ceilings every effective policy is measured against. Four of them
  # decide the container memory limit:
  #
  #   maxActiveCollections x (maxParallel x 8 x maxSampleBytes
  #                           + 2 x 8 x maxMergedBytes)
  #
  # The chart computes that number and renders it as limits.memory, so the
  # limit cannot drift from the configuration it is sized for. 8 is the
  # gateway's decode factor: a profile occupies about eight times its
  # compressed length once decoded.
  # At the values below the limit is 4Gi.
  limits:
    maxParallel: 4
    maxSampleBytes: 33554432
    maxMergedBytes: 67108864
    maxActiveCollections: 2
    # Any other pgo.limits key can be added here and is rendered as written;
    # only the four above take part in the memory arithmetic.

# Raw configuration merged over everything the chart renders, key by key.
# This is where the keys the chart does not model go -- discovery, limits,
# pgo.defaults -- and the escape hatch when a structured value is not enough:
#
#   config:
#     discovery:
#       pprof:
#         port: 6060
#     limits:
#       cpuSeconds: 60
#       maxConcurrentProfiles: 16
#
# It is also where a key the structured values model can be overridden outright,
# server.tls.minVersion included: a value set here wins over what the
# structured blocks rendered.
#
# The keys the memory limit is derived from are the exception: pgo.enabled and
# the four sizing ceilings under pgo.limits (maxParallel, maxSampleBytes,
# maxMergedBytes, maxActiveCollections) are rejected here at render time,
# because the chart reads them from the pgo block above before this block is
# merged, and a value here would leave limits.memory sized for different
# ceilings. Set the pgo block instead.
# The file-path keys the Secret mounts follow are rejected too: nats.credsFile,
# server.tls.certFile, and server.tls.keyFile, because the credentials mount
# follows nats.credsFile and the certificate mount follows tls.enabled, so a
# path set here can name a file nothing mounts. Set the nats and tls blocks
# instead. server, server.tls, and nats set here must be mappings, the way
# pgo and pgo.limits must: a null or scalar would wipe the block the chart
# rendered them into.
#
# A key left out here and out of the structured values above takes the
# binary's own default. server.listen and server.opsListen are the exception:
# the chart renders them to match the container ports it declares, so
# overriding them here moves the listener without moving the probe or the
# Service.
#
# discovery.pprof.allowedPorts and allowedPortNames default to empty lists
# below, which accept any port and any port name a request names; the
# configured discovery.pprof.port or portName, once one is set, always
# passes too. discovery.pprof.port is left out of the default on purpose:
# config.Load refuses a file naming both port and portName, so a default
# port here would collide with a user who sets only portName.
config:
  discovery:
    pprof:
      allowedPorts: []
      allowedPortNames: []
