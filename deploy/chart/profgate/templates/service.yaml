apiVersion: v1
kind: Service
metadata:
  name: {{ include "profgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "profgate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "profgate.selectorLabels" . | nindent 4 }}
  # The ops port stays out of the Service: metrics and health are scraped from
  # the Pod, and nothing routes to them.
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
