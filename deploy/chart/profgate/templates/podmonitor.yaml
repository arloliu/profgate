{{- if include "profgate.boolValue" (dict "key" "podMonitor.enabled" "value" .Values.podMonitor.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "profgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "profgate.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # A PodMonitor rather than a ServiceMonitor, because the ops port carrying
  # /metrics is deliberately absent from the Service: nothing routes to it and
  # it is reached by Pod address. The endpoint names the container port, which
  # is the name the Deployment declares.
  selector:
    matchLabels:
      {{- include "profgate.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - port: ops
      path: /metrics
      interval: {{ .Values.podMonitor.interval | quote }}
      # prometheus-operator writes a target label named endpoint holding the
      # port name above, always ops here, and the gateway sets an endpoint
      # label of its own on profgate_requests_total. Without this drop the
      # target label wins and the gateway's value is renamed to
      # exported_endpoint, so a query scoped endpoint="profile" matches
      # nothing. A relabeling runs before the scrape, so the collision never
      # arises; a metric relabeling runs after the rename and would leave the
      # name gone from both sides.
      relabelings:
        - action: labeldrop
          regex: endpoint
{{- end }}
