# The TLS Secret the API listener serves its certificate from, as a manifest.
#
# Every line here is a comment on purpose: this file carries a private key, so
# it is an example to copy, never a resource to apply. It sits outside
# deploy/base for the same reason, and deploy/base/kustomization.yaml does not
# name it. The shipped base serves plain HTTP and mounts nothing; add the
# volume, the mount, and the server.tls keys with a kustomize patch, or use the
# Helm chart's tls.enabled, which renders all three.
#
# Prefer creating the Secret from the files a certificate authority hands over:
#
#   kubectl -n profgate create secret tls profgate-tls \
#     --cert=tls.crt --key=tls.key
#
# The equivalent manifest, with both PEM files inlined:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: profgate-tls
#   namespace: profgate
# type: kubernetes.io/tls
# stringData:
#   tls.crt: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
#   tls.key: |
#     -----BEGIN PRIVATE KEY-----
#     ...
#     -----END PRIVATE KEY-----
#
# The key names become the file names under the mount, so this Secret appears
# as /etc/profgate/tls/tls.crt and /etc/profgate/tls/tls.key, which is what
# server.tls.certFile and server.tls.keyFile point at.
#
# cert-manager writes exactly these two keys. Point a Certificate's secretName
# at profgate-tls and it renews in place; the gateway re-reads the files while
# it runs, so a renewal needs no rollout and no annotation on the Deployment.
