# The NATS permissions profgate needs, and nothing beyond them.
# Paste this block into the user entry of the account that owns the three
# PROFGATE_ stores, or hand the same two lists to `nsc add user` as
# --allow-pub and --allow-sub.
#
# The subject list is pinned by a test against docs/specs/pgo.md: profgate
# reads and writes only its own buckets, and it may not create, update, or
# delete a stream. STREAM.PURGE on the artifact stream is the one destructive
# stream verb, and it is how the Object Store client deletes an object's
# chunks. The CONSUMER subjects are what listing an Object Store bucket needs;
# DIRECT.GET on the artifact stream is how an object's metadata is read before
# its chunks. Watches and object reads are delivered to an inbox, so _INBOX.>
# is the subscription that actually carries them; the $KV and $O subscriptions
# are granted because the delivery subject is the client's choice, not a
# contract.
permissions: {
  publish: {
    allow: [
      "$JS.API.INFO"

      "$JS.API.STREAM.INFO.KV_PROFGATE_CONFIG"
      "$JS.API.STREAM.INFO.KV_PROFGATE_JOBS"
      "$JS.API.STREAM.INFO.OBJ_PROFGATE_ARTIFACTS"

      "$JS.API.CONSUMER.CREATE.KV_PROFGATE_CONFIG.>"
      "$JS.API.CONSUMER.CREATE.KV_PROFGATE_JOBS.>"
      "$JS.API.CONSUMER.CREATE.OBJ_PROFGATE_ARTIFACTS.>"

      "$JS.API.CONSUMER.DELETE.KV_PROFGATE_CONFIG.>"
      "$JS.API.CONSUMER.DELETE.KV_PROFGATE_JOBS.>"
      "$JS.API.CONSUMER.DELETE.OBJ_PROFGATE_ARTIFACTS.>"

      "$JS.API.CONSUMER.INFO.KV_PROFGATE_CONFIG.>"
      "$JS.API.CONSUMER.INFO.KV_PROFGATE_JOBS.>"
      "$JS.API.CONSUMER.INFO.OBJ_PROFGATE_ARTIFACTS.>"

      "$JS.API.CONSUMER.MSG.NEXT.KV_PROFGATE_CONFIG.>"
      "$JS.API.CONSUMER.MSG.NEXT.KV_PROFGATE_JOBS.>"
      "$JS.API.CONSUMER.MSG.NEXT.OBJ_PROFGATE_ARTIFACTS.>"

      "$JS.API.DIRECT.GET.KV_PROFGATE_CONFIG.>"
      "$JS.API.DIRECT.GET.KV_PROFGATE_JOBS.>"
      "$JS.API.DIRECT.GET.OBJ_PROFGATE_ARTIFACTS.>"

      "$JS.API.STREAM.MSG.GET.KV_PROFGATE_CONFIG"
      "$JS.API.STREAM.MSG.GET.KV_PROFGATE_JOBS"
      "$JS.API.STREAM.MSG.GET.OBJ_PROFGATE_ARTIFACTS"

      "$JS.API.STREAM.PURGE.OBJ_PROFGATE_ARTIFACTS"

      "$KV.PROFGATE_CONFIG.>"
      "$KV.PROFGATE_JOBS.>"
      "$O.PROFGATE_ARTIFACTS.>"
    ]
  }
  subscribe: {
    allow: [
      "_INBOX.>"
      "$KV.PROFGATE_CONFIG.>"
      "$KV.PROFGATE_JOBS.>"
      "$O.PROFGATE_ARTIFACTS.>"
    ]
  }
}
