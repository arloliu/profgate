# The NATS credentials Secret the Deployment mounts, as a manifest.
#
# Every line here is a comment on purpose: this file carries a credential, so
# it is an example to copy, never a resource to apply. It sits outside
# deploy/base for the same reason, and deploy/base/kustomization.yaml does not
# name it.
#
# Prefer creating the Secret from the file the NATS CLI exports:
#
#   kubectl -n profgate create secret generic profgate-nats-creds \
#     --from-file=nats.creds=profgate.creds
#
# The equivalent manifest, with the credentials file inlined:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: profgate-nats-creds
#   namespace: profgate
# type: Opaque
# stringData:
#   nats.creds: |
#     -----BEGIN NATS USER JWT-----
#     ...
#     ------END NATS USER JWT------
#     -----BEGIN USER NKEY SEED-----
#     ...
#     ------END USER NKEY SEED------
#
# The key name becomes the file name under the mount, so this Secret appears
# as /etc/profgate/nats/nats.creds, which is what nats.credsFile points at.
