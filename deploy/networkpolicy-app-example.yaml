# A template for the application's namespace, not part of the base:
# deploy/base/kustomization.yaml does not name it, so `kubectl apply -k
# deploy/base` never touches an application workload. Copy this file, replace
# the namespace, the pod selector labels, and the pprof port with the
# application's own, and apply it next to the application.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: profgate-app-example
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 6060
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: profgate
          podSelector:
            matchLabels:
              app.kubernetes.io/name: profgate
