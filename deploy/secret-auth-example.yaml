# The authentication Secret the Deployment mounts, as a manifest.
#
# Every line here is a comment on purpose: this file carries key material and
# password hashes, so it is an example to copy, never a resource to apply. It
# sits outside deploy/base for the same reason, and
# deploy/base/kustomization.yaml does not name it.
#
# Which keys the Secret needs to hold depends on auth.mode:
#   basic: users.yaml, when auth.basic.usersFile names a file (bcrypt hashes
#     written inline in the ConfigMap need no Secret at all).
#   oidc: cookie.key, always, when auth.oidc.browser is set; issuer-ca.crt,
#     when auth.oidc.caFile names a file; client-secret, when
#     auth.oidc.browser.clientSecretFile names a file.
#
# Generate a cookie key with:
#
#   openssl rand -base64 32 > cookie.key
#
# The first line seals every new cookie; every line still opens one.
# Replicas re-read this file at different moments, so rotating straight to a
# single new key loses a session: a replica that has not re-read yet keeps
# sealing with the old key after another replica has already dropped it.
# Stage the rotation instead:
#   1. Write old,new. Every replica learns to open new while still sealing
#      with old.
#   2. Wait until the ops listener's profgate_auth_cookie_key_info metric
#      reports both fingerprints on every replica.
#   3. Write new,old. Replicas begin sealing with new; old still opens.
#   4. Wait one sessionTTL past every replica reporting new as current.
#   5. Write new alone.
#
# Create the Secret from the files it needs, once they exist:
#
#   kubectl -n profgate create secret generic profgate-auth \
#     --from-file=users.yaml \
#     --from-file=cookie.key \
#     --from-file=issuer-ca.crt \
#     --from-file=client-secret
#
# The equivalent manifest, with every file inlined:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: profgate-auth
#   namespace: profgate
# type: Opaque
# stringData:
#   users.yaml: |
#     users:
#       - name: alice
#         passwordHash: "$2a$12$..."
#         realm: developer
#   cookie.key: |
#     Zm9vYmFyYmF6cXV1eGZvb2JhcmJhenF1dXhmb28=
#   issuer-ca.crt: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
#   client-secret: |
#     the-client-secret-the-issuer-issued
#
# The key names become the file names under the mount, so this Secret
# appears as /etc/profgate/auth/users.yaml, /etc/profgate/auth/cookie.key,
# /etc/profgate/auth/issuer-ca.crt, and /etc/profgate/auth/client-secret,
# which is what auth.basic.usersFile, auth.oidc.browser.cookieKeyFile,
# auth.oidc.caFile, and auth.oidc.browser.clientSecretFile point at.
