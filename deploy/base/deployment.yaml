apiVersion: apps/v1
kind: Deployment
metadata:
  name: profgate
  namespace: profgate
  labels:
    app.kubernetes.io/name: profgate
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: profgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profgate
    spec:
      serviceAccountName: profgate
      # server.drainDelay, the longest profile limits.cpuSeconds or
      # limits.traceSeconds admits, and 60 seconds of slack.
      # `profgate config validate` prints the figure for the ConfigMap.
      terminationGracePeriodSeconds: 125
      securityContext:
        # The uid and gid the distroless image runs as. Without it the kubelet
        # leaves the mounted Secrets owned by root:root and the gateway
        # cannot read them. It only widens group ownership, so the ConfigMap
        # and the ServiceAccount token stay readable exactly as before.
        fsGroup: 65532
      containers:
        - name: profgate
          # A release does not rewrite this line.
          # Set the version this repository runs.
          image: ghcr.io/arloliu/profgate:v0.5.0
          args:
            - serve
            - --config
            - /etc/profgate/config.yaml
          ports:
            - name: api
              containerPort: 8080
            - name: ops
              containerPort: 9090
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
          resources:
            limits:
              # PGO collection is off; the ConfigMap comments its block out.
              # This is the gateway's own footprint. Turning collection on
              # means raising this figure to what `profgate config validate`
              # then prints: 1536Mi at the shipped pgo.limits ceilings.
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/profgate
              readOnly: true
            - name: profgate-nats-creds
              mountPath: /etc/profgate/nats/
              readOnly: true
            - name: profgate-auth
              mountPath: /etc/profgate/auth/
              readOnly: true
      # This base serves plain HTTP on the API port. To serve HTTPS, create the
      # Secret deploy/secret-tls-example.yaml describes, mount it here, and add
      # the server.tls keys to the ConfigMap; the Helm chart's tls.enabled
      # renders all three.
      volumes:
        - name: config
          configMap:
            name: profgate-config
        # The operator creates this Secret from their NATS account credentials;
        # see deploy/nats/README.md. It is optional so the base applies before
        # the Secret exists, which is the default state while PGO is off.
        - name: profgate-nats-creds
          secret:
            secretName: profgate-nats-creds
            defaultMode: 0440
            optional: true
        # The operator creates this Secret from the files auth.mode needs --
        # see deploy/secret-auth-example.yaml. It is optional so the base
        # applies before the Secret exists; the gateway itself refuses to
        # start when a configured file is missing.
        - name: profgate-auth
          secret:
            secretName: profgate-auth
            defaultMode: 0440
            optional: true
