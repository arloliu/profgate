apiVersion: v1
kind: ConfigMap
metadata:
  name: profgate-config
  namespace: profgate
data:
  config.yaml: |
    server:
      listen: ":8080"
      opsListen: ":9090"
      logLevel: info
      # The window between /readyz turning 503 and the API listener closing,
      # so the EndpointSlice controllers and every kube-proxy stop routing new
      # requests here first. It is part of the grace period below.
      drainDelay: 5s
    discovery:
      versionLabel: app.kubernetes.io/version
      pprof:
        port: 6060
        # What a request may name instead of the port above; the configured
        # default always passes. Empty accepts only that default. Entries are
        # {port: N} or {portName: name}; {port: "*"} and {portName: "*"} open
        # every port number or every port name.
        allowedSelections: []
    limits:
      cpuSeconds: 60
      traceSeconds: 60
      maxConcurrentProfiles: 16
    auth:
      mode: disabled
      anonymousRealm: developer
    # The console is off. To serve it at /ui/, uncomment:
    #
    # ui:
    #   enabled: true
    #
    # Under auth.mode: oidc, configure auth.oidc.browser first: a console
    # that cannot log a browser in serves nobody.
    realms:
      developer:
        namespaces: ["*"]
        services: ["*"]
        profiles: ["*"]
        # PGO access is off for a realm that names no pgo block.
        # pgo:
        #   read: true
        #   collect: true
        #   configure: true
    # PGO collection is off. To turn it on, provision the NATS stores and the
    # account of deploy/nats/README.md, create the credentials Secret, and
    # uncomment:
    #
    # nats:
    #   url: nats://nats.profgate.svc:4222
    #   credsFile: /etc/profgate/nats/nats.creds
    # pgo:
    #   enabled: true
    #   configAPI: enabled
    #
    # Every pgo.limits ceiling then keeps the shipped default, which is what
    # the 4Gi memory limit in deployment.yaml is sized from.
    #
    # terminationGracePeriodSeconds stays at 125 with PGO on. A terminating
    # replica stops renewing the lease on every Collection it owns and waits
    # only until each owner has committed or reached the cutoff of the lease it
    # last renewed, which is pgo.leaseTTL minus five seconds of clock skew. So
    # a rollout interrupts a running Collection: another replica reclaims it
    # and retries from round zero, as long as an attempt remains under
    # pgo.maxAttempts. The 125 covers the gateway's own drain either way:
    # server.drainDelay, the longest profile, and 60 seconds of slack.
