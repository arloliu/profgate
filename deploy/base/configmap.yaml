apiVersion: v1
kind: ConfigMap
metadata:
  name: profgate-config
  namespace: profgate
data:
  config.yaml: |
    server:
      listen: ":8080"
      opsListen: ":9090"
      logLevel: info
      # The window between /readyz turning 503 and the API listener closing,
      # so the EndpointSlice controllers and every kube-proxy stop routing new
      # requests here first. It is part of the grace period below.
      drainDelay: 5s
    discovery:
      versionLabel: app.kubernetes.io/version
      pprof:
        port: 6060
        # Empty accepts any port a request names; the configured port always passes too.
        allowedPorts: []
        # Empty accepts any port name a request names; the configured port name, if set, always passes too.
        allowedPortNames: []
    limits:
      cpuSeconds: 60
      traceSeconds: 60
      maxConcurrentProfiles: 16
    auth:
      mode: disabled
      anonymousRealm: developer
    # The console is off. To serve it at /ui/, uncomment:
    #
    # ui:
    #   enabled: true
    #
    # Under auth.mode: oidc, configure auth.oidc.browser first: a console
    # that cannot log a browser in serves nobody.
    realms:
      developer:
        namespaces: ["*"]
        services: ["*"]
        profiles: ["*"]
        # PGO access is off for a realm that names no pgo block.
        # pgo:
        #   read: true
        #   collect: true
        #   configure: true
    # PGO collection is off. To turn it on, provision the NATS stores and the
    # account of deploy/nats/README.md, create the credentials Secret, and
    # uncomment:
    #
    # nats:
    #   url: nats://nats.profgate.svc:4222
    #   credsFile: /etc/profgate/nats/nats.creds
    # pgo:
    #   enabled: true
    #   configAPI: enabled
    #
    # Every pgo.limits ceiling then keeps the shipped default, which is what
    # the 4Gi memory limit in deployment.yaml is sized from.
    #
    # An enabled gateway asks for terminationGracePeriodSeconds 122465, the
    # number `profgate config validate` prints for this configuration. That is
    # the worst case over every policy the ceilings admit -- one Pod at a time,
    # the longest sample, the most rounds -- so it is large. An operator who
    # does not want to wait that long can leave the grace period lower:
    # SIGKILL discards the interrupted attempt's samples, and another replica
    # reclaims the Collection and retries from round zero only if the lease
    # expires before the Collection's deadline and an attempt remains;
    # otherwise it fails as deadline_exceeded or attempts_exhausted. The base
    # stays at 125, which covers the gateway's own drain with PGO off:
    # server.drainDelay, the longest profile, and 60 seconds of slack.
