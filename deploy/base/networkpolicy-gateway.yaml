apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: profgate
  namespace: profgate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: profgate
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    - ports:
        - protocol: TCP
          port: 9090
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
