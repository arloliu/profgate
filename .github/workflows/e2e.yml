name: e2e
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
jobs:
  lanes:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.list.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - id: list
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then FLAG="-unfrozen"; fi
          echo "lanes=$(mise exec -- go run ./test/e2e/cmd/lanes $FLAG)" >> "$GITHUB_OUTPUT"
  e2e:
    needs: lanes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.lanes.outputs.lanes) }}
    env:
      PROFGATE_E2E_REGISTRY: ghcr.io/${{ github.repository_owner }}
      PROFGATE_E2E_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The console scenarios drive a browser, which is not a Go module and is not pinned by mise.toml.
      # Installing one here is what makes the version the suite runs against a choice rather than
      # whatever the runner image happens to carry; the runner refuses a major outside the range it accepts.
      - name: install the pinned browser
        env:
          CHROME_VERSION: "152.0.7977.64"
        run: |
          set -eu
          curl -fsSL -o /tmp/chrome-linux64.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip"
          unzip -q /tmp/chrome-linux64.zip -d /opt
          test -x /opt/chrome-linux64/chrome
          /opt/chrome-linux64/chrome --version
          echo "PROFGATE_E2E_BROWSER=/opt/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: mise run test:e2e
