# The workload the end-to-end scenarios profile. It carries no namespace: the
# harness applies it into each scenario's namespace. A deleted Pod stays
# Terminating for the 30-second preStop sleep so a scenario can observe it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapp
  labels:
    app.kubernetes.io/name: testapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: testapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testapp
        app.kubernetes.io/version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: testapp
          image: ko.local/testapp:e2e
          ports:
            - name: pprof
              containerPort: 6060
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: pprof
            periodSeconds: 1
            failureThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/ko-app/testapp", "sleep", "30"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: testapp
  labels:
    app.kubernetes.io/name: testapp
spec:
  selector:
    app.kubernetes.io/name: testapp
  ports:
    - name: pprof
      port: 6060
      targetPort: pprof
      protocol: TCP
