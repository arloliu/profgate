# The OpenID Connect issuer the auth scenarios log in through. It carries no
# namespace: the harness applies it into the scenario's namespace beside the
# gateway that trusts it.
#
# dex-config holds Dex's static configuration and dex-tls the certificate its
# HTTPS listener serves; the harness writes both before this manifest is
# applied. Storage is in memory, so every start mints a new signing key, which
# is how a scenario rotates the key: it restarts the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          command:
            - /usr/local/bin/dex
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: https
              containerPort: 5556
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tls
              mountPath: /etc/dex/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dex-config
        - name: tls
          secret:
            secretName: dex-tls
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: https
      port: 5556
      targetPort: https
      protocol: TCP
