# The shipped Deployment's container, volumes, and security context, at one
# replica: the credentials Secret is mounted the way deploy/base mounts it, so a
# scenario proves the shipped mount rather than one of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profgate-pgo
  labels:
    app.kubernetes.io/name: profgate-pgo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: profgate-pgo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profgate-pgo
    spec:
      serviceAccountName: profgate-pgo
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
      containers:
        - name: profgate
          image: ko.local/profgate:e2e
          args:
            - serve
            - --config
            - /etc/profgate/config.yaml
          ports:
            - name: api
              containerPort: 8080
            - name: ops
              containerPort: 9090
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
          volumeMounts:
            - name: config
              mountPath: /etc/profgate
              readOnly: true
            - name: profgate-nats-creds
              mountPath: /etc/profgate/nats/
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: profgate-pgo
        - name: profgate-nats-creds
          secret:
            secretName: profgate-nats-creds
            defaultMode: 0440
            optional: true
