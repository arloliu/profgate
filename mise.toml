[tools]
go = "1.26.7"
golangci-lint = "2.12.2"
helm = "3.21.4"
kind = ["0.32.0", "0.22.0"]
ko = "0.19.1"
kubectl = "1.36.4"
promtool = "3.7.3"

[env]
# Fail loudly when go.mod asks for a toolchain mise did not install,
# instead of silently downloading a different one.
GOTOOLCHAIN = "local"

# Every task listed here works today. A task that fails is worse than no task:
# an agent reads it as a claim that it works.
[tasks.check]
description = "Verify the repository invariants that need no build"
# Runs on the system python3 with standard library only; mise does not pin it.
run = "python3 scripts/check-repo.py"

[tasks.hooks]
description = "Point this clone at the repository's git hooks (run once per clone)"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath = .githooks'"

[tasks.prose]
description = "semlf on the lines changed since main; the pre-commit hook runs the same check against HEAD"
run = "semlf --base origin/main"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test -race ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks."test:e2e"]
description = "End-to-end suite on the lane named by PROFGATE_E2E_LANE (default current)"
run = "go test -tags e2e -count=1 -timeout 40m ./test/e2e/..."

[tasks.release]
description = "Check the repository is ready to tag, then tag and push: mise run release -- vX.Y.Z"
# The tag is what publishes; this only refuses to create one that would
# publish from a dirty, unpushed, or red commit. Needs git and gh.
run = "bash scripts/release.sh"
