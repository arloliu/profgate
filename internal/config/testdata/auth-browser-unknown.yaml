server:
  tls:
    certFile: testdata/tls.crt
    keyFile: testdata/tls.key
auth:
  mode: oidc
  oidc:
    issuer: https://issuer.example
    audience: profgate
    mapping:
      defaultRealm: developer
    browser:
      clientId: profgate
      redirectURL: https://profgate.example/auth/callback
      cookieKeyFile: testdata/cookie.key
realms:
  developer:
    namespaces: ["*"]
    services: ["*"]
    profiles: ["*"]
